name: windows

on:
  push:
  pull_request:

jobs:
  skill:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ffmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Install source package
        shell: pwsh
        run: python -m pip install -e ".[dev]"

      - name: Skill selfcheck
        shell: pwsh
        run: python skills\video2book\scripts\selfcheck.py

      # 行为测试住在 skills/video2book/tests/（`testpaths` 已在 pyproject 里声明）。
      # 少了这一步，那套用例在 CI 上等于不存在：本地全绿也挡不住回归进主干。
      - name: Skill behaviour tests
        shell: pwsh
        run: python -m pytest -q
