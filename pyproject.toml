[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video2book"
version = "3.1.0"
description = "Batch-transform Bilibili, YouTube, Douyin videos & local media into publication-grade deep-dive textbooks and structured review books."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.0.0",
    "requests>=2.28.0",
]
license = {text = "MIT"}
authors = [
    {name = "LINJIANG12"}
]
keywords = ["bilibili", "youtube", "douyin", "local-video", "video-to-markdown", "study-notes", "ai-agent", "multimodal-ai", "cheatsheet-generator", "deep-dive-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.scripts]
video2book = "src.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

# 技能自包含于 skills/video2book/：包发现与入口都指向该目录，
# 因此 `pip install -e .` 装到的是技能本体（核心 skill + 工具链），不带仓库级杂物。
[tool.setuptools.packages.find]
where = ["skills/video2book"]
include = ["src*"]

# 行为测试住在技能目录里（安装单元边界内），与扁平门禁 scripts/selfcheck.py 分工：
# pytest 管行为，selfcheck 管便宜的入口级门禁。
[tool.pytest.ini_options]
testpaths = ["skills/video2book/tests"]
pythonpath = ["skills/video2book"]
addopts = "-ra"
markers = [
    "ffmpeg: 需要系统 ffmpeg/ffprobe 的用例（缺外部命令时可用 -m 'not ffmpeg' 跳过）",
]

